name: "Build Android SmartBoard APK"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: "Build & Release SmartBoard APK"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" || true

      - name: Copy web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Build Android APK via Gradle
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_build.log

      - name: Attach Debug Log on Failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          files: gradle_build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename and Prepare APK
        run: |
          mkdir -p release-apk
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} release-apk/TreadCode_1.0.8.apk \;
          cp release-apk/TreadCode_1.0.8.apk release-apk/TreadCode-SmartBoard.apk
          ls -la release-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TreadCode-SmartBoard-APK
          path: release-apk/*.apk
          retention-days: 14

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          files: release-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
