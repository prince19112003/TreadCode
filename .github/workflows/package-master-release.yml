name: "Package Master Distribution Suite"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  package-master:
    name: "Assemble Master Distribution Package"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download existing release assets
        run: |
          mkdir -p downloaded_assets release-apk
          cd downloaded_assets
          BASE_URL="https://github.com/prince19112003/TreadCode/releases/download/v1.0.8"
          
          curl -fSL -O "$BASE_URL/TreadCode_1.0.8_x64-setup.exe" || true
          curl -fSL -O "$BASE_URL/TreadCode_1.0.8.apk" || true
          curl -fSL -O "$BASE_URL/TreadCode_1.0.8_amd64.AppImage" || true
          curl -fSL -O "$BASE_URL/TreadCode_1.0.8_amd64.deb" || true
          curl -fSL -O "$BASE_URL/TreadCode-USB-Portable.zip" || true
          
          cp TreadCode_1.0.8.apk ../release-apk/TreadCode_Android_SmartBoard.apk 2>/dev/null || true
          cd ..
          ls -lh downloaded_assets/

      - name: Install dependencies & build frontend
        run: |
          npm ci
          npm run build

      - name: Export USB Portable Bundle
        run: |
          node scripts/export_usb_bundle.js

      - name: Export Master Distribution Package
        run: |
          node scripts/export_master_pack.js

      - name: Copy downloaded Linux AppImage & DEB into Master Package
        run: |
          VERSION="1.0.8"
          TARGET_DIR="release-master/staging/TreadCode_Master_Package_v${VERSION}/01_Standalone_Installers"
          
          cp downloaded_assets/TreadCode_1.0.8_x64-setup.exe "$TARGET_DIR/" 2>/dev/null || true
          cp downloaded_assets/TreadCode_1.0.8_amd64.AppImage "$TARGET_DIR/" 2>/dev/null || true
          cp downloaded_assets/TreadCode_1.0.8_amd64.deb "$TARGET_DIR/" 2>/dev/null || true
          
          cd release-master/staging
          zip -r "../TreadCode_Master_Package_v${VERSION}.zip" "TreadCode_Master_Package_v${VERSION}"
          cd ../..
          ls -lh release-master/

      - name: Upload Master Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TreadCode-Master-Distribution-Package
          path: release-master/TreadCode_Master_Package_v1.0.8.zip
          retention-days: 14

      - name: Attach Master Package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          files: release-master/TreadCode_Master_Package_v1.0.8.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
