name: "Build Linux AppImage & DEB"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: "Build Linux Release (.AppImage & .deb)"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            squashfs-tools

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend application
        run: npm run build

      - name: Build Linux packages via Tauri
        run: npx tauri build --bundles appimage,deb

      - name: Prepare Linux artifacts
        run: |
          mkdir -p release-linux
          find src-tauri/target/release/bundle -type f \( -name "*.AppImage" -o -name "*.deb" \) -exec cp {} release-linux/ \; || true

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TreadCode-Linux-Packages
          path: release-linux/*
          retention-days: 14

      - name: Attach Linux packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-linux/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
